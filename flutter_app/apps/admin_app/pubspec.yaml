name: admin_app
description: USA Luxury Limo - Admin Panel App
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core
  theme:
    path: ../../packages/theme
  auth:
    path: ../../packages/features/auth
  flutter_riverpod: ^2.4.10
  go_router: ^13.2.0
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.2.4
  intl: ^0.19.0
  flutter_local_notifications: ^17.0.0
  fl_chart: ^0.66.2
  data_table_2: ^2.5.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/tenant/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/admin_icon.png"
  adaptive_icon_background: "#1e3a5f"
  adaptive_icon_foreground: "assets/icons/admin_icon_foreground.png"
